buname: Build PCL iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'
          architecture: x64

      - name: Install build tools
        run: brew install cmake make ldid

      - name: Clone Amethyst with dependencies
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/AngelAuraMC/Amethyst-iOS.git \
            "$RUNNER_TEMP/Amethyst-iOS"

      - name: Apply PCL iOS native interface
        env:
          PCL_HOME_B64: ""
          PCL_NAV_HEADER_B64: ""
        run: |
          python3 - <<'PY'
          import base64
          import os
          import plistlib
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'Amethyst-iOS'

          def write_b64(relative, variable):
              target = root / relative
              target.write_bytes(base64.b64decode(os.environ[variable]))

          def replace_once(relative, old, new):
              target = root / relative
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f'Upstream changed; patch target not found: {relative}: {old}')
              target.write_text(text.replace(old, new, 1))

          write_b64('Natives/LauncherNewsViewController.m', 'PCL_HOME_B64')
          write_b64('Natives/LauncherNavigationController.h', 'PCL_NAV_HEADER_B64')

          replace_once(
              'Natives/LauncherMenuViewController.m',
              'indexPathForRow:1 inSection:0',
              'indexPathForRow:0 inSection:0',
          )
          replace_once(
              'Natives/LauncherMenuViewController.m',
              'self.lastSelectedIndex = 1;',
              'self.lastSelectedIndex = 0;',
          )
          replace_once(
              'Natives/LauncherSplitViewController.m',
              '#import "LauncherMenuViewController.h"',
              '#import "LauncherMenuViewController.h"\n#import "LauncherNewsViewController.h"',
          )
          replace_once(
              'Natives/LauncherSplitViewController.m',
              '[[LauncherProfilesViewController alloc] init]',
              '[[LauncherNewsViewController alloc] init]',
          )

          plist_path = root / 'Natives/Info.plist'
          with plist_path.open('rb') as source:
              info = plistlib.load(source)
          info['CFBundleDisplayName'] = 'PCL iOS'
          info['NSLocalNetworkUsageDescription'] = (
              'PCL iOS uses the local network to find AltServer, enable JIT, and discover LAN servers.'
          )
          info['NSMicrophoneUsageDescription'] = (
              'PCL iOS uses the microphone when a Minecraft voice chat mod requests it.'
          )
          with plist_path.open('wb') as output:
              plistlib.dump(info, output, sort_keys=False)
          PY

            - name: Build unsigned sideload IPA
        working-directory: ${{ runner.temp }}/Amethyst-iOS
        run: |
          perl -i -pe 'print "#include <mach/mach.h>\n" if $. == 1' Natives/JavaLauncher.m
          gmake -j2 package \
            PLATFORM=2 \
            RELEASE=1 \
            BOOTJDK="$JAVA_HOME/bin"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PCL-iOS-IPA
          path: ${{ runner.temp }}/Amethyst-iOS/artifacts/*.ipa
          if-no-files-found: error
          retention-days: 7
